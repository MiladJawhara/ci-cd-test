name: CI

on:
    push: 
        branches:
            - main
    pull_request: 
        branches:
            - main

permissions:
    contents: read

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check Out Repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                 node-version: 24
                 cache: npm
            
            - name: Install Dependencies
              run: npm ci
            
            - name: Verify Application
              run: npm run verify
